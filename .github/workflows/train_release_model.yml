name: Train and release the model
on: 
  workflow_dispatch:
  pull_request:

jobs:
  train:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'  # Cache dependencies
      
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preprocess data
        run: |
          mkdir -p output
          python src/text_preprocessing.py

      - name: Train the model
        run: python src/text_classification.py

      - name: Read version from version.py
        id: version
        run: |
          VERSION=$(grep "__version__" src/version.py | sed -E "s/.*\"(.*)\"/\1/")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Create release
        run: | 
          gh release create "${{ steps.version.outputs.version }}" output/*.joblib \
            --title "Model ${{ steps.version.outputs.version }}" \
            --notes "Trained SMS spam detection model ${{ steps.version.outputs.version }}"
