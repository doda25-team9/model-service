name: Train and release the model
on: 
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preprocess data
        run: |
          mkdir -p output
          python src/text_preprocessing.py

      - name: Train the model
        run: python src/text_classification.py

      - name: Read version from version.py
        id: version
        run: |
          VERSION=$(grep "__version__" src/version.py | sed -E "s/.*\"(.*)\"/\1/")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Commit release version
        run: |
          git add src/version.py
          git commit -m "chore: release model version ${{ steps.version.outputs.version }}" || echo "No changes"

      - name: Create release tag
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release model version ${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: | 
          gh release create "v${{ steps.version.outputs.version }}" output/*.joblib \
            --title "Model v${{ steps.version.outputs.version }}" \
            --notes "Trained SMS spam detection model ${{ steps.version.outputs.version }}"

      - name: Bump version
        run: |
          CURRENT="${{ steps.version.outputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          sed -i "s/__version__ = \".*\"/__version__ = \"$NEXT_VERSION\"/" src/version.py

      - name: Commit and push bump
        run: |
          git add src/version.py
          git commit -m "chore: bump to next version [skip ci]"
          git push origin main