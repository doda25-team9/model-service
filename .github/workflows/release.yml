name: Release Model-Service Container

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get release version
        id: version
        run: |
          CURRENT=$(grep "__version__" src/version.py | sed -E 's/.*"(.*)"/\1/')
          echo "Current version: $CURRENT"
          echo "release=$CURRENT" >> $GITHUB_OUTPUT

      - name: Commit release version
        run: |
          git add src/version.py
          git commit -m "chore: release container version ${{ steps.version.outputs.release }}" || echo "No changes to commit"

      - name: Create release tag
        run: git tag -a "container-v${{ steps.version.outputs.release }}" -m "Release container version ${{ steps.version.outputs.release }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/doda25-team9/model-service:${{ steps.version.outputs.release }}
            ghcr.io/doda25-team9/model-service:latest

      - name: Bump to next development version
        run: |
          CURRENT="${{ steps.version.outputs.release }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          sed -i "s/__version__ = \".*\"/__version__ = \"$NEXT_VERSION\"/" src/version.py
          echo "Bumped to: $NEXT_VERSION"

      - name: Commit development version
        run: |
          git add src/version.py
          git commit -m "chore: bump to next development version [skip ci]"

      - name: Push changes
        run: |
          git push origin main
          git push origin --tags